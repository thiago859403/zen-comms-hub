name: E2E (Playwright)

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, variaveis_supabase]

# Cancela runs anteriores do mesmo branch/PR para economizar minutos
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # GitHub Secrets → projeto restaurado dztevycwxlnrrvnvutyc
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_EMAIL_DOMAIN: nuvia.com
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Versão lida de packageManager em package.json (pnpm@9.15.9)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify Supabase secrets
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Defina VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY em GitHub Secrets (projeto dztevycwxlnrrvnvutyc)."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY ausente — E2E usará signup UI (sujeito a rate limit)."
          fi
          if ! echo "$VITE_SUPABASE_URL" | grep -q "dztevycwxlnrrvnvutyc"; then
            echo "::warning::VITE_SUPABASE_URL não aponta para dztevycwxlnrrvnvutyc — confira os secrets do repositório."
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium only)
        run: pnpm exec playwright install chromium --with-deps

      - name: Build application
        run: pnpm build
        timeout-minutes: 5

      - name: Start preview server
        run: |
          pnpm preview --host 127.0.0.1 --port 4173 &
          echo $! > preview.pid

      - name: Wait for server to be ready
        run: |
          echo "Waiting for http://127.0.0.1:4173 ..."
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:4173 > /dev/null 2>&1; do sleep 1; done'
          echo "Server is ready!"

      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium --workers=1
        timeout-minutes: 18

      - name: Stop preview server
        if: always()
        run: |
          if [ -f preview.pid ]; then
            kill "$(cat preview.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
