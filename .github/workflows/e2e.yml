name: E2E (Playwright)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Supabase secrets
        run: |
          missing=0
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::VITE_SUPABASE_URL is empty - add this secret in repo Settings > Secrets > Actions"
            missing=1
          else
            echo "VITE_SUPABASE_URL is set"
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY is empty - add this secret in repo Settings > Secrets > Actions"
            missing=1
          else
            echo "VITE_SUPABASE_ANON_KEY is set"
          fi
          if [ "$missing" = "1" ]; then
            echo ""
            echo "======================================================="
            echo "  GitHub Secrets not configured for this repository"
            echo "======================================================="
            echo "Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "Add these repository secrets:"
            echo "  VITE_SUPABASE_URL      = https://xxxxx.supabase.co"
            echo "  VITE_SUPABASE_ANON_KEY = eyJhbGciOi... (anon JWT key)"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium only)
        run: pnpm exec playwright install chromium --with-deps

      - name: Build application
        run: pnpm build
        timeout-minutes: 3

      - name: Start preview server
        run: pnpm preview --host 127.0.0.1 --port 4173 &
        timeout-minutes: 1

      - name: Wait for server to be ready
        run: |
          echo "Waiting for http://127.0.0.1:4173 ..."
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:4173 > /dev/null 2>&1; do sleep 1; done'
          echo "Server is ready!"
        timeout-minutes: 1

      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium
        timeout-minutes: 20

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
