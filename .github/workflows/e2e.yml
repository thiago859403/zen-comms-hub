name: E2E (Playwright)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium only)
        run: pnpm exec playwright install chromium --with-deps

      - name: Build application
        run: pnpm build
        timeout-minutes: 3

      - name: Start preview server
        run: pnpm preview --host 0.0.0.0 --port 4173 &
        timeout-minutes: 1

      - name: Wait for server to be ready
        run: |
          echo "Waiting for http://127.0.0.1:4173 ..."
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:4173 > /dev/null 2>&1; do sleep 1; done'
          echo "Server is ready!"
        timeout-minutes: 1

      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium
        timeout-minutes: 10

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
